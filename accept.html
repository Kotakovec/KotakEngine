<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine - Accept</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #4caf50; --bg: #000; --card-bg: #121212; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: var(--card-bg); border: 1px solid #333; border-radius: 30px; padding: 35px; width: 85%; max-width: 350px; text-align: center; }
        .btn { background: var(--primary); color: #000; text-decoration: none; padding: 18px; border-radius: 40px; display: block; font-weight: bold; margin-top: 20px; }
        #preview-img { max-width: 100%; border-radius: 10px; margin-top: 15px; display: none; border: 1px solid #333; }
    </style>
</head>
<body>
    <div class="card">
        <div id="loader">Hledám soubor...</div>
        <div id="content" style="display:none">
            <h2 style="color:var(--primary); margin:0;">Soubor přijat!</h2>
            <div id="fname" style="font-weight:bold; margin-top:10px; word-break: break-all;"></div>
            <img id="preview-img" src="">
            <a id="link" href="" download class="btn">STÁHNOUT</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBlgu2gdLYiAtqMlN2ABprU6rrXS-w5JfI",
            databaseURL: "https://kotakengine-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotakengine"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const id = new URLSearchParams(window.location.search).get('id');

        if (id) {
            db.ref('shares/' + id).on('value', (snap) => {
                const val = snap.val();
                if (val && val.active && Date.now() < val.expires) {
                    document.getElementById('loader').style.display = "none";
                    document.getElementById('content').style.display = "block";
                    document.getElementById('fname').innerText = val.name;
                    
                    const link = document.getElementById('link');
                    link.href = val.data;
                    link.download = val.name;

                    if (val.type && val.type.startsWith('image/')) {
                        const img = document.getElementById('preview-img');
                        img.src = val.data;
                        img.style.display = "block";
                    }
                } else {
                    document.getElementById('loader').innerText = "Žádný aktivní soubor.";
                }
            });
        }
    </script>
</body>
</html>
