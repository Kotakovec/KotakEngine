<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KotakEngine</title>
    <style>
        /* Celkový vzhled aplikace */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            overflow: hidden;
        }

        /* Kontejner pro hlavní menu */
        #main-menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            height: 100vh;
            overflow-y: auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #4caf50;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 600px;
        }

        /* Karty jednotlivých aplikací */
        .finta-card {
            background: #1a1a1a;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #333;
            text-align: center;
            padding: 10px;
        }

        .finta-card:hover {
            transform: translateY(-5px);
            background: #252525;
            border-color: #4caf50;
        }

        .finta-card i {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* Iframe okno pro zobrazení file.html atd. */
        #webview-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            z-index: 100;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* To tvoje kulaté tlačítko ZPĚT */
        #back-button {
            position: fixed;
            top: 20px;
            left: -70px; /* Schované vlevo */
            width: 55px;
            height: 55px;
            background-color: #4caf50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 999;
            transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
        }

        #back-button.visible {
            left: 20px; /* Vyjede na scénu */
        }
    </style>
</head>
<body>

    <div id="main-menu">
        <h1>KotakEngine</h1>
        
        <div class="grid">
            <div class="finta-card" onclick="otevriAplikaci('file.html')">
                <span>🔐</span>
                <h3>File Encrypter</h3>
            </div>

            <div class="finta-card" onclick="otevriAplikaci('brzy.html')">
                <span>🚀</span>
                <h3>Další finta</h3>
            </div>
            
            <div class="finta-card" onclick="otevriAplikaci('nastaveni.html')">
                <span>⚙️</span>
                <h3>Nastavení</h3>
            </div>
        </div>
    </div>

    <button id="back-button" onclick="zpetDoMenu()">&#10094;</button>

    <div id="webview-container">
        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        const mainMenu = document.getElementById('main-menu');
        const webviewContainer = document.getElementById('webview-container');
        const appFrame = document.getElementById('app-frame');
        const backButton = document.getElementById('back-button');

        function otevriAplikaci(stranka) {
            // Načteme soubor (např. file.html) do iframe
            appFrame.src = stranka;
            
            // Přepneme viditelnost
            mainMenu.style.display = 'none';
            webviewContainer.style.display = 'block';
            
            // Animace tlačítka zpět
            setTimeout(() => {
                backButton.classList.add('visible');
            }, 300);
        }

        function zpetDoMenu() {
            // Schováme tlačítko
            backButton.classList.remove('visible');
            
            // Vrátíme se do menu
            setTimeout(() => {
                webviewContainer.style.display = 'none';
                mainMenu.style.display = 'flex';
                appFrame.src = ""; // Stopneme načtenou stránku
            }, 300);
        }
    </script>

</body>
</html>
