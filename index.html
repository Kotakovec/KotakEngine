<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        :root {
            --primary: #4caf50; /* Změnil jsem na tvou zelenou, ať to ladí */
            --bg: #121212;
            --card-bg: #1e1e1e;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg); color: white;
            font-family: sans-serif; overflow: hidden;
        }

        #install-screen {
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; text-align: center; padding: 30px; box-sizing: border-box;
        }

        .logo-img {
            width: 120px; height: 120px; border-radius: 25px;
            margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-image: url('logo.png'); background-size: cover; background-position: center;
        }

        #btn-install {
            display: none; background: var(--primary); color: #000;
            border: none; padding: 18px 40px; border-radius: 30px;
            font-weight: bold; font-size: 16px; margin: 20px 0; cursor: pointer;
        }

        .instruction-box {
            background: var(--card-bg); padding: 20px;
            border-radius: 15px; border: 1px solid #333;
            max-width: 300px; font-size: 14px; color: #aaa;
        }

        #main-app-container { display: none; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="install-screen">
        <div class="logo-img"></div>
        <h1>KotakEngine</h1>
        <p>Pro vstup do aplikace si ji přidej na plochu.</p>
        
        <button id="btn-install">INSTALOVAT TEĎ</button>

        <div class="instruction-box">
            <b>iPhone:</b> Klepni na ikonu sdílení a zvol "Přidat na plochu".<br><br>
            <b>Android:</b> Klepni na tlačítko výše nebo na tři tečky v prohlížeči.
        </div>
    </div>

    <div id="main-app-container">
        <iframe id="main-frame" src=""></iframe>
    </div>

    <script>
        let deferredPrompt;
        const installScreen = document.getElementById('install-screen');
        const mainAppContainer = document.getElementById('main-app-container');
        const mainFrame = document.getElementById('main-frame');
        const btnInstall = document.getElementById('btn-install');

        function checkStatus() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            
            if (isStandalone) {
                installScreen.style.display = "none";
                mainAppContainer.style.display = "block";
                // OPRAVA: Používáme relativní cestu bez lomítka na začátku
                mainFrame.src = "main.html"; 
            } else {
                installScreen.style.display = "flex";
                mainAppContainer.style.display = "none";
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstall.style.display = 'block';
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                btnInstall.style.display = 'none';
            }
        });

        window.addEventListener('load', checkStatus);
    </script>
</body>
</html>
