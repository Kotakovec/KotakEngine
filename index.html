<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>KotakEngine - Encrypter</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin-top: 60px; /* Aby nebylo pod tím kulatým tlačítkem */
        }
        .box {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }
        input[type="text"], input[type="password"] {
            background: #2a2a2a;
            color: white;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-encrypt { background: #4caf50; color: white; }
        .btn-decrypt { background: #2196f3; color: white; }
        button:disabled { background: #555; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.9em; color: #aaa; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🔐 File Encrypter</h2>
        <p>Zašifruj nebo dešifruj soubor</p>
        
        <input type="file" id="fileInput">
        <input type="password" id="password" placeholder="Zadej silné heslo">
        
        <button class="btn-encrypt" onclick="processFile('encrypt')">Zašifrovat a stáhnout</button>
        <button class="btn-decrypt" onclick="processFile('decrypt')">Dešifrovat a stáhnout</button>
        
        <div id="status">Připraveno.</div>
    </div>

    <script>
        // Funkce pro odvození šifrovacího klíče z hesla
        async function getKlic(heslo, salt) {
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey(
                "raw", enc.encode(heslo), "PBKDF2", false, ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false, ["encrypt", "decrypt"]
            );
        }

        async function processFile(akce) {
            const fileInput = document.getElementById('fileInput');
            const password = document.getElementById('password').value;
            const status = document.getElementById('status');

            if (!fileInput.files[0] || !password) {
                alert("Vyber soubor a zadej heslo!");
                return;
            }

            status.innerText = "Pracuji...";
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    let resultBuffer;

                    if (akce === 'encrypt') {
                        // ŠIFROVÁNÍ
                        const salt = crypto.getRandomValues(new Uint8Array(16));
                        const iv = crypto.getRandomValues(new Uint8Array(12));
                        const klic = await getKlic(password, salt);
                        
                        const encrypted = await crypto.subtle.encrypt(
                            { name: "AES-GCM", iv: iv }, klic, data
                        );

                        // Spojíme Salt + IV + Data do jednoho souboru
                        resultBuffer = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
                        resultBuffer.set(salt, 0);
                        resultBuffer.set(iv, salt.length);
                        resultBuffer.set(new Uint8Array(encrypted), salt.length + iv.length);
                        
                        saveFile(resultBuffer, file.name + ".locked");
                    } else {
                        // DEŠIFROVÁNÍ
                        const salt = data.slice(0, 16);
                        const iv = data.slice(16, 28);
                        const encryptedData = data.slice(28);
                        const klic = await getKlic(password, salt);

                        const decrypted = await crypto.subtle.decrypt(
                            { name: "AES-GCM", iv: iv }, klic, encryptedData
                        );

                        saveFile(new Uint8Array(decrypted), file.name.replace(".locked", ""));
                    }
                    status.innerText = "Hotovo!";
                } catch (err) {
                    console.error(err);
                    status.innerText = "Chyba! Pravděpodobně špatné heslo.";
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function saveFile(data, fileName) {
            const blob = new Blob([data], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
