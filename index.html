<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #4caf50; --bg: #000; --card-bg: #111; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        
        .page-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 10; }
        
        /* ÚDRŽBA */
        .m-container { width: 85%; max-width: 400px; padding: 40px 30px; border: 1px solid #222; border-radius: 40px; background: #111; text-align: center; }
        .loader-bar { width: 100%; height: 10px; background: #1a1a1a; margin-top: 30px; border-radius: 20px; overflow: hidden; border: 1px solid #333; }
        #progress-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.5s linear; }

        /* APP */
        #app-layer { z-index: 5; display: block; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="maintenance-layer" class="page-layer">
        <div class="m-container">
            <div style="font-size:50px">🛠️</div>
            <h1 style="color:var(--primary)">Údržba systému</h1>
            <p id="m-text" style="color:#888">Probíhá aktualizace softwaru...</p>
            <div class="loader-bar"><div id="progress-fill"></div></div>
        </div>
    </div>

    <div id="app-layer" class="page-layer">
        <iframe id="main-frame" src=""></iframe>
    </div>

    <script>
        // --- ⚙️ TVŮJ FIREBASE CONFIG (Doplň svoje údaje) ---
        const firebaseConfig = {
            apiKey: "TVOJE_API_KEY",
            authDomain: "TVŮJ_PROJEKT.firebaseapp.com",
            databaseURL: "https://TVŮJ_PROJEKT-default-rtdb.firebaseio.com",
            projectId: "TVŮJ_PROJEKT",
            storageBucket: "TVŮJ_PROJEKT.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        // --------------------------------------------------

        const mLayer = document.getElementById('maintenance-layer');
        const appLayer = document.getElementById('app-layer');
        const mainFrame = document.getElementById('main-frame');
        const fill = document.getElementById('progress-fill');

        let currentMode = "";

        // HLAVNÍ FUNKCE HLÍDÁNÍ
        function syncMaintenance() {
            // Cesta v databázi: /settings/maintenance
            db.ref('settings/maintenance').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const now = Date.now();
                const start = new Date(data.startTime).getTime(); // Formát: '2026-03-25T18:00:00'
                const end = new Date(data.endTime).getTime();

                if (now >= start && now < end) {
                    // JE ÚDRŽBA
                    mLayer.style.display = "flex";
                    appLayer.style.display = "none";
                    
                    // Progress Bar
                    const total = end - start;
                    const elapsed = now - start;
                    fill.style.width = Math.max(0, Math.min(100, (elapsed / total) * 100)) + "%";

                    if (currentMode !== "maintenance") {
                        currentMode = "maintenance";
                        mainFrame.src = "about:blank";
                    }
                } else {
                    // BĚŽNÝ PROVOZ
                    mLayer.style.display = "none";
                    appLayer.style.display = "block";

                    if (currentMode !== "app") {
                        currentMode = "app";
                        mainFrame.src = "main.html?v=" + now;
                    }
                }
            });
        }

        // Spustit synchronizaci
        syncMaintenance();

        // Každou minutu refreshni progres bar, kdyby uživatel nechal appku otevřenou
        setInterval(syncMaintenance, 30000);
    </script>
</body>
</html>
