<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOTAK Web Player</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 480px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #3b82f6; margin-bottom: 20px; }
        .media-container { background: #000; border-radius: 12px; margin-bottom: 20px; min-height: 150px; display: flex; align-items: center; justify-content: center; border: 1px solid #475569; overflow: hidden; }
        .media-content { max-width: 100%; max-height: 350px; }
        .controls { display: none; flex-direction: column; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; width: 100%; margin-top: 5px; }
        .btn-blue { background: #3b82f6; }
        .btn-green { background: #10b981; }
        .btn-red { background: #ef4444; }
        input[type="file"] { margin-bottom: 20px; color: #94a3b8; }
        input[type="password"] { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>Kotak Engine</h1>
    <h3>File Transform</h3>
    
    <div id="upload-section">
        <p style="color: #94a3b8;">Select file and transfer to .kotak / .ppkotak</p>
        <input type="file" id="fileInput">
    </div>

    <div id="player-section" class="hidden">
        <div id="file-info" style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px;"></div>
        <div class="media-container" id="mediaHolder"></div>
        
        <div class="controls" id="actionControls" style="display: flex;">
            <input type="password" id="passwordInput" placeholder="Heslo (pro .ppkotak)">
            <button class="btn btn-green" onclick="handleAction('restore')">OBNOVIT PŮVODNÍ SOUBOR</button>
            <button class="btn btn-red" onclick="handleAction('lock')">ZAMKNOUT NA .PPKOTAK</button>
            <button class="btn btn-blue" style="background:#6366f1" onclick="handleAction('kotak')">PŘEVÉST NA .KOTAK</button>
        </div>
        <br><a href="#" onclick="location.reload()" style="color: #64748b; font-size: 0.8rem; text-decoration: none;">← Choose another</a>
    </div>
</div>

<script>
    const SIGNATURE = "KOTAK_V2";
    let currentFileData = null;
    let currentFileName = "";
    let detectedExt = ".bin";

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        currentFileName = file.name;
        const arrayBuffer = await file.arrayBuffer();
        let data = new Uint8Array(arrayBuffer);

        // Kontrola, zda jde o .kotak
        if (currentFileName.endsWith('.kotak')) {
            const sig = new TextDecoder().decode(data.slice(0, 8));
            if (sig === SIGNATURE) {
                detectedExt = new TextDecoder().decode(data.slice(8, 18)).trim();
                data = data.slice(18);
            }
        } else {
            detectedExt = currentFileName.substring(currentFileName.lastIndexOf('.'));
        }

        currentFileData = data;
        showPreview(data, detectedExt);
    });

    function showPreview(data, ext) {
        const blob = new Blob([data]);
        const url = URL.createObjectURL(blob);
        const holder = document.getElementById('mediaHolder');
        holder.innerHTML = '';
        
        const extLower = ext.toLowerCase();
        let el;

        if (['.jpg', '.jpeg', '.png', '.gif', '.webp'].includes(extLower)) {
            el = document.createElement('img');
        } else if (['.mp4', '.webm'].includes(extLower)) {
            el = document.createElement('video');
            el.controls = true;
        } else if (['.mp3', '.wav', '.ogg'].includes(extLower)) {
            el = document.createElement('audio');
            el.controls = true;
        }

        if (el) {
            el.src = url;
            el.className = 'media-content';
            holder.appendChild(el);
        } else {
            holder.innerHTML = `<p>Náhled pro ${ext} není k dispozici</p>`;
        }

        document.getElementById('upload-section').classList.add('hidden');
        document.getElementById('player-section').classList.remove('hidden');
        document.getElementById('file-info').innerText = `Detekováno: ${ext}`;
    }

    async function handleAction(mode) {
        const password = document.getElementById('passwordInput').value || "kotak";
        let finalData;
        let finalName = currentFileName.split('.')[0];

        if (mode === 'restore') {
            finalData = currentFileData;
            finalName += detectedExt;
        } else if (mode === 'kotak') {
            const header = new TextEncoder().encode(SIGNATURE + detectedExt.padEnd(10));
            finalData = new Uint8Array(header.length + currentFileData.length);
            finalData.set(header);
            finalData.set(currentFileData, header.length);
            finalName += ".kotak";
        } else if (mode === 'lock') {
            // Jednoduchý XOR v JS (Digitální beton)
            const passHash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password));
            const key = new Uint8Array(passHash);
            const header = new TextEncoder().encode(detectedExt.padEnd(10));
            const combined = new Uint8Array(header.length + currentFileData.length);
            combined.set(header);
            combined.set(currentFileData, header.length);
            
            finalData = new Uint8Array(combined.length);
            for (let i = 0; i < combined.length; i++) {
                finalData[i] = combined[i] ^ key[i % key.length];
            }
            finalName += ".ppkotak";
        }

        // Stáhnutí souboru
        const blob = new Blob([finalData], {type: "application/octet-stream"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = finalName;
        link.click();
    }
</script>

</body>
</html>
