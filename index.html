<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        
        /* Vrstvy stránek */
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10; background: #000; }
        
        /* Instalace */
        #inst-layer { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .logo { width: 120px; height: 120px; border-radius: 30px; margin-bottom: 20px; background: url('logo.png') center/cover; }
        #btn-install { background: #4caf50; color: #000; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold; margin-top: 20px; display: none; }

        /* Údržba */
        #maint-layer { flex-direction: column; align-items: center; justify-content: center; }
        .m-box { width: 80%; max-width: 350px; text-align: center; }
        .bar-bg { width: 100%; height: 8px; background: #111; border-radius: 10px; margin-top: 30px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #4caf50; transition: width 0.5s linear; box-shadow: 0 0 15px #4caf50; }

        /* App Iframe */
        #app-layer { display: block; z-index: 5; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
    </style>
</head>
<body>

    <div id="inst-layer" class="layer">
        <div class="logo"></div>
        <h1>KotakEngine</h1>
        <p style="color:#555">Spusť aplikaci z plochy</p>
        <button id="btn-install">INSTALOVAT</button>
    </div>

    <div id="maint-layer" class="layer">
        <div class="m-box">
            <div style="font-size: 50px;">🛠️</div>
            <h1 style="color:#4caf50; margin: 10px 0;">Údržba</h1>
            <p style="color:#444">Aktualizujeme systémy...</p>
            <div class="bar-bg"><div id="bar-fill"></div></div>
        </div>
    </div>

    <div id="app-layer" class="layer">
        <iframe id="main-frame" src=""></iframe>
    </div>

    <script>
        // --- ⚙️ TVŮJ FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "TVOJE_API_KEY",
            databaseURL: "https://TVOJE_DATABAZE.firebaseio.com",
            projectId: "TVUJ_PROJEKT",
            appId: "TVOJE_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const lInst = document.getElementById('inst-layer');
        const lMaint = document.getElementById('maint-layer');
        const lApp = document.getElementById('app-layer');
        const frame = document.getElementById('main-frame');
        const fill = document.getElementById('bar-fill');

        let activeView = "";

        function updateUI() {
            const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            
            if (!isPWA) {
                switchLayer('inst');
                return;
            }

            // Taháme data z RTDB (cesta settings/maintenance)
            db.ref('settings/maintenance').on('value', (snap) => {
                const data = snap.val();
                if (!data) return;

                const now = Date.now();
                const start = new Date(data.startTime).getTime();
                const end = new Date(data.endTime).getTime();

                if (now >= start && now < end) {
                    // Stav: ÚDRŽBA
                    switchLayer('maint');
                    const progress = ((now - start) / (end - start)) * 100;
                    fill.style.width = Math.max(0, Math.min(100, progress)) + "%";
                    
                    if (activeView !== "maint") {
                        activeView = "maint";
                        frame.src = "about:blank";
                    }
                } else {
                    // Stav: PROVOZ
                    switchLayer('app');
                    if (activeView !== "app") {
                        activeView = "app";
                        frame.src = "main.html?v=" + now;
                    }
                }
            });
        }

        function switchLayer(id) {
            lInst.style.display = (id === 'inst') ? 'flex' : 'none';
            lMaint.style.display = (id === 'maint') ? 'flex' : 'none';
            lApp.style.display = (id === 'app') ? 'block' : 'none';
        }

        // Instalace (Android)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('btn-install').style.display = 'block';
        });
        document.getElementById('btn-install').onclick = () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
            }
        };

        // Spustit hned a pak hlídat každých 10s pro jistotu
        updateUI();
        setInterval(updateUI, 10000);
    </script>
</body>
</html>
