<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        :root {
            --primary: #ff4757;
            --bg: #121212;
            --card-bg: #1e1e1e;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* --- INSTALAČNÍ BRÁNA --- */
        #install-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .logo-img {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-image: url('logo.png');
            background-size: cover;
            background-position: center;
        }

        #btn-install {
            display: none;
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            margin: 20px 0;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
        }

        .instruction-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
            max-width: 300px;
            font-size: 14px;
        }

        /* --- HLAVNÍ MENU --- */
        #main-ui {
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            height: 100vh;
            overflow-y: auto;
        }

        .finta-card {
            background: var(--card-bg);
            padding: 25px;
            margin: 15px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            cursor: pointer;
            border: 1px solid #222;
            transition: transform 0.2s;
        }

        .finta-card:active { transform: scale(0.96); }

        /* --- IFRAME / WEBVIEW --- */
        #webview-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
        }

        iframe { width: 100%; height: 100%; border: none; }

        #back-button {
            position: fixed;
            top: 30px;
            left: -70px;
            width: 55px;
            height: 55px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            z-index: 200;
            transition: left 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        #back-button.visible { left: 20px; }
    </style>
</head>
<body>

    <div id="install-screen">
        <div class="logo-img"></div>
        <h1>KotakEngine</h1>
        <p>Pro spuštění aplikaci přidej na plochu.</p>
        
        <button id="btn-install">INSTALOVAT TEĎ</button>

        <div class="instruction-box" id="ios-info">
            Klepni na <b>ikonu sdílení</b> a zvol <b>"Přidat na plochu"</b>.
        </div>
    </div>

    <div id="main-ui">
        <h1>Finty</h1>
        <div class="finta-card" onclick="openFinta('https://tvoje-finta-1.html')">
            <h2>Finta #1</h2>
            <p>Popis první vychytávky</p>
        </div>
        <div class="finta-card" onclick="openFinta('https://tvoje-finta-2.html')">
            <h2>Finta #2</h2>
            <p>Popis druhé vychytávky</p>
        </div>
    </div>

    <button id="back-button" onclick="closeFinta()">&#10094;</button>
    <div id="webview-container">
        <iframe id="app-frame" src=""></iframe>
    </div>

    <script>
        let deferredPrompt;
        const installScreen = document.getElementById('install-screen');
        const mainUI = document.getElementById('main-ui');
        const btnInstall = document.getElementById('btn-install');
        const appFrame = document.getElementById('app-frame');
        const webviewContainer = document.getElementById('webview-container');
        const backBtn = document.getElementById('back-button');

        function checkStatus() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (isStandalone) {
                installScreen.style.display = "none";
                mainUI.style.display = "flex";
            } else {
                installScreen.style.display = "flex";
            }
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstall.style.display = 'block';
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                btnInstall.style.display = 'none';
            }
        });

        function openFinta(url) {
            appFrame.src = url;
            webviewContainer.style.display = "block";
            setTimeout(() => { backBtn.classList.add('visible'); }, 400);
        }

        function closeFinta() {
            backBtn.classList.remove('visible');
            setTimeout(() => {
                webviewContainer.style.display = "none";
                appFrame.src = "";
            }, 300);
        }

        window.addEventListener('load', checkStatus);
    </script>
</body>
</html>
