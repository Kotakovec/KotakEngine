<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        :root { --primary: #4caf50; --bg: #000; --card-bg: #111; }
        body, html { margin: 0; padding: 0; height: 100%; background-color: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        #install-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 30px; box-sizing: border-box; }
        .logo-img { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 25px; background-image: url('logo.png'); background-size: cover; background-position: center; }
        #btn-install { display: none; background: var(--primary); color: #000; border: none; padding: 18px 40px; border-radius: 30px; font-weight: bold; font-size: 16px; margin: 20px 0; cursor: pointer; }
        #maintenance-overlay { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #000; color: white; text-align: center; }
        .m-container { width: 85%; max-width: 400px; padding: 40px 30px; border: 1px solid #222; border-radius: 40px; background: #111; }
        .loader-bar { width: 100%; height: 10px; background: #1a1a1a; margin-top: 30px; border-radius: 20px; overflow: hidden; border: 1px solid #333; }
        #progress-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.5s linear; }
        #main-app-container { display: none; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="install-screen">
        <div class="logo-img"></div>
        <h1>KotakEngine</h1>
        <button id="btn-install">INSTALOVAT TEĎ</button>
    </div>

    <div id="maintenance-overlay">
        <div class="m-container">
            <div style="font-size: 50px;">🛠️</div>
            <h1>Údržba systému</h1>
            <div id="maintenance-timer" style="color: #555; font-size: 12px; margin-bottom: 10px;">...</div>
            <div class="loader-bar"><div id="progress-fill"></div></div>
        </div>
    </div>

    <div id="main-app-container">
        <iframe id="main-frame" src=""></iframe>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlgu2gdLYiAtqMlN2ABprU6rrXS-w5JfI",
            authDomain: "kotakengine.firebaseapp.com",
            databaseURL: "https://kotakengine-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotakengine",
            appId: "1:165516964834:web:2d3089665eefa76d9bffbb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let mStart = 0, mEnd = 0, currentAppMode = "";

        const layers = {
            inst: document.getElementById('install-screen'),
            maint: document.getElementById('maintenance-overlay'),
            app: document.getElementById('main-app-container'),
            frame: document.getElementById('main-frame'),
            fill: document.getElementById('progress-fill'),
            timer: document.getElementById('maintenance-timer')
        };

        function updateUI() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const now = Date.now();

            if (!isStandalone) {
                layers.inst.style.display = "flex";
                layers.maint.style.display = "none";
                layers.app.style.display = "none";
                return;
            }

            if (mStart > 0 && now >= mStart && now < mEnd) {
                layers.inst.style.display = "none";
                layers.app.style.display = "none";
                layers.maint.style.display = "flex";
                layers.frame.src = "";
                currentAppMode = "";
                
                const perc = ((now - mStart) / (mEnd - mStart)) * 100;
                layers.fill.style.width = Math.min(perc, 100) + "%";
                layers.timer.innerText = `Konec za ${Math.round((mEnd - now) / 1000)}s`;
            } else {
                layers.inst.style.display = "none";
                layers.maint.style.display = "none";
                layers.app.style.display = "block";

                // --- ROZHODOVÁNÍ O STRÁNCE ---
                const params = new URLSearchParams(window.location.search);
                const id = params.get('id');

                if (id) {
                    if (currentAppMode !== "accept") {
                        currentAppMode = "accept";
                        layers.frame.src = "accept.html?id=" + id; // TADY TO POSÍLÁME NA ACCEPT
                    }
                } else {
                    if (currentAppMode !== "main") {
                        currentAppMode = "main";
                        layers.frame.src = "main.html?v=" + now;
                    }
                }
            }
        }

        onValue(ref(db, 'settings/maintenance'), (snap) => {
            const data = snap.val();
            if (data) {
                mStart = new Date(data.startTime).getTime();
                mEnd = new Date(data.endTime).getTime();
                updateUI();
            }
        });

        setInterval(updateUI, 1000);
        window.addEventListener('load', updateUI);
    </script>
</body>
</html>
