<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak Engine</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 480px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #3b82f6; margin-bottom: 5px; }
        h3 { color: #94a3b8; font-weight: normal; margin-bottom: 20px; }
        .media-container { background: #000; border-radius: 12px; margin-bottom: 20px; min-height: 150px; display: flex; align-items: center; justify-content: center; border: 1px solid #475569; overflow: hidden; flex-direction: column; padding: 10px; }
        .media-content { max-width: 100%; max-height: 350px; }
        .btn { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; width: 100%; margin-top: 5px; }
        .btn-blue { background: #3b82f6; }
        .btn-green { background: #10b981; }
        input[type="file"] { margin-bottom: 20px; color: #94a3b8; width: 100%; }
        input[type="password"] { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #334155; box-sizing: border-box; }
        .hidden { display: none; }
        .lock-msg { color: #ef4444; font-weight: bold; font-size: 1.1rem; }
        .lock-sub { color: #64748b; font-size: 0.8rem; margin-top: 5px; }
        a { color: #64748b; font-size: 0.8rem; text-decoration: none; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<div class="card">
    <h1>Kotak Engine</h1>
    <h3>File Transform</h3>

    <div id="upload-section">
        <p style="color: #94a3b8;">Select file or .kotak / .ppkotak</p>
        <input type="password" id="initialPassword" placeholder="Heslo pro odemčení .ppkotak">
        <input type="file" id="fileInput">
    </div>

    <div id="player-section" class="hidden">
        <div id="file-info" style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px;"></div>
        
        <div class="media-container" id="mediaHolder"></div>

        <div class="controls" id="actionControls">
            <input type="password" id="savePassword" placeholder="Heslo (Optional - pro .ppkotak)" oninput="updateButtonText()">
            <button class="btn btn-blue" id="mainActionBtn" onclick="handleMainAction()">Vytvořit soubor .kotak</button>
            <button class="btn btn-green" style="margin-top:10px;" id="dlBtn" onclick="downloadOriginal()">DOWNLOAD ORIGINAL</button>
        </div>
        <a href="#" onclick="location.reload()">← Choose another</a>
    </div>
</div>

<script>
    const SIGNATURE = "KOTAK_V2";
    let currentFileData = null;
    let currentFileName = "";
    let detectedExt = ".bin";
    let isEncrypted = false;
    let originalSourceType = ""; // Pomůže nám vědět, co uživatel nahrál

    // Dynamická změna textu tlačítek
    function updateButtonText() {
        const pass = document.getElementById('savePassword').value;
        const btn = document.getElementById('mainActionBtn');
        
        if (originalSourceType === "ppkotak") {
            btn.innerText = "Vytvořit soubor .kotak";
            btn.style.background = "#3b82f6";
        } else {
            if (pass.length > 0) {
                btn.innerText = "Vytvořit soubor .ppkotak";
                btn.style.background = "#ef4444";
            } else {
                btn.innerText = "Vytvořit soubor .kotak";
                btn.style.background = "#3b82f6";
            }
        }
    }

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        currentFileName = file.name;
        const arrayBuffer = await file.arrayBuffer();
        let data = new Uint8Array(arrayBuffer);
        let pass = document.getElementById('initialPassword').value;

        const holder = document.getElementById('mediaHolder');
        document.getElementById('upload-section').classList.add('hidden');
        document.getElementById('player-section').classList.remove('hidden');

        if (currentFileName.endsWith('.ppkotak')) {
            originalSourceType = "ppkotak";
            if (!pass) {
                isEncrypted = true;
                holder.innerHTML = `<div class="lock-msg">SOUBOR JE ŠIFROVÁN</div><div class="lock-sub">technologií Kotak File Engine</div>`;
                document.getElementById('file-info').innerText = `Uzamčený soubor: ${currentFileName}`;
                document.getElementById('dlBtn').classList.add('hidden');
                updateButtonText();
                return;
            } else {
                const key = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass)));
                let decrypted = new Uint8Array(data.length);
                for (let i = 0; i < data.length; i++) {
                    decrypted[i] = data[i] ^ key[i % key.length];
                }
                detectedExt = new TextDecoder().decode(decrypted.slice(0, 10)).trim();
                data = decrypted.slice(10);
                isEncrypted = false;
                document.getElementById('dlBtn').classList.remove('hidden');
            }
        } 
        else if (currentFileName.endsWith('.kotak')) {
            originalSourceType = "kotak";
            const sig = new TextDecoder().decode(data.slice(0, 8));
            if (sig === SIGNATURE) {
                detectedExt = new TextDecoder().decode(data.slice(8, 18)).trim();
                data = data.slice(18);
            }
            isEncrypted = false;
        } 
        else {
            originalSourceType = "normal";
            detectedExt = currentFileName.substring(currentFileName.lastIndexOf('.'));
            isEncrypted = false;
        }

        currentFileData = data;
        updateButtonText();
        showPreview(data, detectedExt);
    });

    function showPreview(data, ext) {
        const blob = new Blob([data]);
        const url = URL.createObjectURL(blob);
        const holder = document.getElementById('mediaHolder');
        holder.innerHTML = '';
        const extLower = ext.toLowerCase();

        let el;
        if (['.jpg', '.jpeg', '.png', '.gif', '.webp'].includes(extLower)) {
            el = document.createElement('img');
        } else if (['.mp4', '.webm'].includes(extLower)) {
            el = document.createElement('video'); el.controls = true;
        } else if (['.mp3', '.wav', '.ogg', '.m4a'].includes(extLower)) {
            el = document.createElement('audio'); el.controls = true;
        }

        if (el) { 
            el.src = url; el.className = 'media-content'; holder.appendChild(el); 
        } else { 
            holder.innerHTML = `<p>Náhled pro ${ext} není k dispozici (Odemčeno)</p>`; 
        }
        document.getElementById('file-info').innerText = `Soubor: ${currentFileName} (${ext})`;
        document.getElementById('dlBtn').innerText = "DOWNLOAD ORIGINAL (" + ext.toUpperCase() + ")";
    }

    async function handleMainAction() {
        if (isEncrypted) { alert("Soubor musíte nejprve odemknout!"); return; }
        const password = document.getElementById('savePassword').value;
        
        // Pokud jsme nahráli .ppkotak, vždy vytváříme .kotak (pokud není zadáno nové heslo pro přešifrování)
        // V tomto kódu pro jednoduchost: prázdné heslo = .kotak, heslo = .ppkotak
        await processFile(password ? 'ppkotak' : 'kotak', password);
    }

    async function processFile(mode, password) {
        let finalData;
        let finalName = currentFileName.split('.')[0];

        if (mode === 'kotak') {
            const header = new TextEncoder().encode(SIGNATURE + detectedExt.padEnd(10));
            finalData = new Uint8Array(header.length + currentFileData.length);
            finalData.set(header);
            finalData.set(currentFileData, header.length);
            finalName += ".kotak";
        } else {
            const key = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(password)));
            const header = new TextEncoder().encode(detectedExt.padEnd(10));
            const combined = new Uint8Array(header.length + currentFileData.length);
            combined.set(header);
            combined.set(currentFileData, header.length);
            
            finalData = new Uint8Array(combined.length);
            for (let i = 0; i < combined.length; i++) {
                finalData[i] = combined[i] ^ key[i % key.length];
            }
            finalName += ".ppkotak";
        }
        download(finalData, finalName);
    }

    function downloadOriginal() {
        if (isEncrypted) return;
        download(currentFileData, currentFileName.split('.')[0] + detectedExt);
    }

    function download(data, name) {
        const blob = new Blob([data], {type: "application/octet-stream"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = name;
        link.click();
    }
</script>

</body>
</html>
