<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
            color: #ffffff;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            pointer-events: none; 
        }

        #app-wrapper {
            display: flex;
            width: 200vw;
            height: 100vh;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            position: relative;
        }

        #app-wrapper.slide-left { transform: translateX(-100vw); }

        .page {
            width: 100vw;
            height: 100vh;
            flex-shrink: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        #main-menu {
            padding: 40px 20px 20px 20px;
            background: rgba(0, 0, 0, 0.4); 
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #4caf50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.6);
            text-align: center;
        }

        /* Horní část s velkými tlačítky */
        .top-section {
            flex-grow: 1; /* Odtlačí zbytek dolů */
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Spodní část s tlačítky vedle sebe */
        .bottom-section {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 10px auto;
            display: flex;
            gap: 12px;
        }

        /* Společný styl kapsle */
        .finta-card {
            background: rgba(22, 22, 22, 0.85); 
            backdrop-filter: blur(5px); 
            display: flex;
            align-items: center;
            padding: 15px 25px;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
            border: 1px solid rgba(76, 175, 80, 0.3);
            position: relative;
            min-height: 60px;
            box-sizing: border-box;
        }

        .finta-card:active {
            transform: scale(0.97);
            border-color: #ff4757;
        }

        /* Malé kapsle dole */
        .small-card {
            flex: 1;
            padding: 12px 10px;
            border-radius: 30px;
            min-height: 55px;
        }

        .finta-card .emoji {
            font-size: 22px;
            margin-right: 12px;
        }

        .finta-card h3 {
            margin: 0;
            font-size: 1rem;
            width: 100%;
            text-align: center;
            font-weight: 500;
        }

        /* Úprava textu pro malé kapsle, aby se tam vešel */
        .small-card h3 {
            font-size: 0.85rem;
        }

        #webview-page { background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        #back-button {
            position: fixed;
            top: 15px;
            left: -70px;
            width: 55px;
            height: 55px;
            background-color: #4caf50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            z-index: 999;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
        }
        #back-button.visible { left: 15px; }
    </style>
</head>
<body>

    <button id="back-button" onclick="zpetDoMenu()">&#10094;</button>

    <div id="app-wrapper">
        <div class="page" id="main-menu">
            <h1>KotakEngine</h1>

            <div class="top-section" id="top-grid">
                </div>

            <div class="bottom-section" id="bottom-grid">
                </div>
        </div>

        <div class="page" id="webview-page">
            <iframe id="app-frame" src=""></iframe>
        </div>
    </div>

    <script>
        // Data pro horní část (3x stejné dle zadání)
        const horniFinty = [
            { nazev: "File Encrypter", emoji: "🔐", soubor: "file.html" },
            { nazev: "In maintenance", emoji: "❌️", soubor: "404.html" },
            { nazev: "Coming soon", emoji: "❔️", soubor: "404.html" }
        ];

        // Data pro spodní část
        const spodniFinty = [
            { nazev: "Odeslat", emoji: "📤", soubor: "send.html" },
            { nazev: "Nastavení", emoji: "⚙️", soubor: "settings.html" }
        ];

        const topGrid = document.getElementById('top-grid');
        const bottomGrid = document.getElementById('bottom-grid');

        // Vykreslení horních velkých tlačítek
        horniFinty.forEach(finta => {
            const card = document.createElement('div');
            card.className = 'finta-card';
            card.onclick = () => otevriAplikaci(finta.soubor);
            card.innerHTML = `<span class="emoji">${finta.emoji}</span><h3>${finta.nazev}</h3>`;
            topGrid.appendChild(card);
        });

        // Vykreslení spodních tlačítek vedle sebe
        spodniFinty.forEach(finta => {
            const card = document.createElement('div');
            card.className = 'finta-card small-card';
            card.onclick = () => otevriAplikaci(finta.soubor);
            card.innerHTML = `<span class="emoji">${finta.emoji}</span><h3>${finta.nazev}</h3>`;
            bottomGrid.appendChild(card);
        });

        const appWrapper = document.getElementById('app-wrapper');
        const appFrame = document.getElementById('app-frame');
        const backButton = document.getElementById('back-button');

        function otevriAplikaci(stranka) {
            appFrame.src = stranka + (window.location.search || "");
            appWrapper.classList.add('slide-left');
            setTimeout(() => { backButton.classList.add('visible'); }, 300);
        }

        function zpetDoMenu() {
            backButton.classList.remove('visible');
            appWrapper.classList.remove('slide-left');
            setTimeout(() => { appFrame.src = ""; }, 500);
        }

        /* --- ANIMACE POZADÍ (Zůstává stejná) --- */
        var App = {};
        App.setup = function() {
            var canvas = document.createElement('canvas');
            this.canvas = canvas; document.body.appendChild(canvas);
            this.ctx = this.canvas.getContext('2d');
            this.onResize();
            this.stepCount = 0; this.particles = []; this.lifespan = 1000;
            this.maxPop = 200; this.birthFreq = 2; this.gridSize = 10;
            this.gridSteps = Math.floor(1000 / this.gridSize);
            this.grid = [];
            for (var xx = -500; xx < 500; xx += this.gridSize) {
                for (var yy = -500; yy < 500; yy += this.gridSize) {
                    var r = Math.sqrt(xx*xx+yy*yy), r0 = 100, field;
                    if (r < r0) field = 255 / r0 * r;
                    else field = 255 - Math.min(255, (r - r0)/2);
                    this.grid.push({x: xx, y: yy, busyAge: 0, spotIndex: this.grid.length, field: field});
                }
            }
        };
        App.onResize = function() {
            this.width = this.canvas.width = window.innerWidth;
            this.height = this.canvas.height = window.innerHeight;
            this.xC = this.width / 2; this.yC = this.height / 2;
        };
        App.birth = function() {
            var gridSpotIndex = Math.floor(Math.random() * this.grid.length);
            var gridSpot = this.grid[gridSpotIndex];
            this.particles.push({
                hue: 120, sat: 70, lum: 40,
                x: gridSpot.x, y: gridSpot.y, xLast: gridSpot.x, yLast: gridSpot.y,
                xSpeed: 0, ySpeed: 0, age: 0, ageSinceStuck: 0,
                attractor: { oldIndex: gridSpotIndex, gridSpotIndex: gridSpotIndex },
                name: 'p' + Math.random()
            });
        };
        App.move = function() {
            for (var i = this.particles.length - 1; i >= 0; i--) {
                var p = this.particles[i]; p.xLast = p.x; p.yLast = p.y;
                var index = p.attractor.gridSpotIndex; var gridSpot = this.grid[index];
                if (Math.random() < 0.5) {
                    var neighbors = [index-1, index+1, index-this.gridSteps, index+this.gridSteps];
                    var best = gridSpot;
                    neighbors.forEach(idx => { if (this.grid[idx] && this.grid[idx].field > best.field) best = this.grid[idx]; });
                    if (best.busyAge == 0) { p.ageSinceStuck = 0; p.attractor.oldIndex = index; p.attractor.gridSpotIndex = best.spotIndex; best.busyAge = 1; }
                    else p.ageSinceStuck++;
                }
                var k = 8, visc = 0.4;
                p.xSpeed = (p.xSpeed + (gridSpot.x - p.x) * k) * visc;
                p.ySpeed = (p.ySpeed + (gridSpot.y - p.y) * k) * visc;
                p.x += 0.05 * p.xSpeed; p.y += 0.05 * p.ySpeed;
                p.age++; if (p.age > this.lifespan || p.ageSinceStuck > 10) this.particles.splice(i, 1);
            }
        };
        App.draw = function() {
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            this.ctx.fillRect(0, 0, this.width, this.height);
            this.particles.forEach(p => {
                var lx = this.xC + p.xLast * 1.5, ly = this.yC + p.yLast * 1.5;
                var nx = this.xC + p.x * 1.5, ny = this.yC + p.y * 1.5;
                this.ctx.beginPath(); this.ctx.strokeStyle = `hsla(${p.hue}, ${p.sat}%, ${p.lum}%, 1)`;
                this.ctx.moveTo(lx, ly); this.ctx.lineTo(nx, ny); this.ctx.stroke();
            });
        };
        window.addEventListener('resize', () => App.onResize());
        App.setup();
        function frame() {
            App.stepCount++; if (App.stepCount % App.birthFreq == 0 && App.particles.length < App.maxPop) App.birth();
            App.move(); App.draw(); requestAnimationFrame(frame);
        }
        frame();
    </script>
</body>
</html>
