<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Údržba | KotakEngine</title>
    <style>
        :root { --primary: #4caf50; --bg: #000; --card-bg: #111; }
        body, html { margin: 0; padding: 0; height: 100%; background-color: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* Hlavní kontejner údržby */
        #maintenance-ui {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; text-align: center; flex-direction: column;
        }

        .container { width: 85%; max-width: 400px; padding: 40px 30px; border: 1px solid #222; border-radius: 40px; background: var(--card-bg); }
        .icon { font-size: 50px; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0 0 10px 0; font-size: 1.5rem; }
        p { color: #888; line-height: 1.6; margin-bottom: 5px; font-size: 14px; }
        
        .loader-bar { 
            width: 100%; height: 10px; background: #1a1a1a; 
            margin-top: 30px; border-radius: 20px; overflow: hidden; 
            border: 1px solid #333;
        }
        #progress-fill { 
            width: 0%; height: 100%; background: var(--primary); 
            transition: width 0.5s linear;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        /* Iframe pro přesměrování */
        #app-frame { display: none; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="maintenance-ui">
        <div class="container">
            <div class="icon">🛠️</div>
            <h1>Údržba systému</h1>
            <p>Právě probíhá aktualizace KotakEngine.</p>
            <p>Za malý okamžik budeme zpět.</p>
            
            <div class="loader-bar">
                <div id="progress-fill"></div>
            </div>
        </div>
    </div>

    <iframe id="app-frame" src=""></iframe>

    <script>
        // ==========================================
        //  ⚙️ NASTAVENÍ KONCE ÚDRŽBY (Změň tyto 3 hodnoty)
        // ==========================================
        const den = 26;       // Den (1-31)
        const mesic = 3;      // Měsíc (1-12)
        const casKonce = "00:00"; // Formát HH:MM (24h)
        // ==========================================

        const progressFill = document.getElementById('progress-fill');
        const maintenanceUI = document.getElementById('maintenance-ui');
        const appFrame = document.getElementById('app-frame');

        // Automatické sestavení data (rok se doplní sám)
        const rok = new Date().getFullYear();
        const endString = `${rok}-${String(mesic).padStart(2, '0')}-${String(den).padStart(2, '0')}T${casKonce}:00`;
        const endTime = new Date(endString).getTime();
        
        // Začátek údržby (pro výpočet procent) - dáváme 30 minut před koncem jako výchozí bod pro bar
        const startTime = endTime - (30 * 60 * 1000); 

        function updateProgress() {
            const now = new Date().getTime();
            const total = endTime - startTime;
            const elapsed = now - startTime;
            
            let percent = (elapsed / total) * 100;
            
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;

            progressFill.style.width = percent + "%";

            // KONTROLA DOKONČENÍ
            if (percent >= 100) {
                // Skryjeme údržbu a ukážeme index.html v iFramu
                maintenanceUI.style.display = "none";
                appFrame.style.display = "block";
                appFrame.src = "index.html"; 
                clearInterval(checkInterval); // Zastavíme smyčku
            }
        }

        const checkInterval = setInterval(updateProgress, 1000);
        updateProgress();
    </script>
</body>
</html>
