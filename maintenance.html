<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Údržba | KotakEngine</title>
    <style>
        :root { --primary: #4caf50; --bg: #000; --card-bg: #111; }
        body, html { margin: 0; padding: 0; height: 100%; background-color: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; }
        
        #maintenance-ui {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; text-align: center; flex-direction: column;
            width: 100%;
        }

        .container { width: 85%; max-width: 400px; padding: 40px 30px; border: 1px solid #222; border-radius: 40px; background: var(--card-bg); box-sizing: border-box; }
        .icon { font-size: 50px; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0 0 10px 0; font-size: 1.5rem; }
        p { color: #888; line-height: 1.6; margin-bottom: 5px; font-size: 14px; }
        
        .loader-bar { 
            width: 100%; height: 10px; background: #1a1a1a; 
            margin-top: 30px; border-radius: 20px; overflow: hidden; 
            border: 1px solid #333;
        }
        #progress-fill { 
            width: 0%; height: 100%; background: var(--primary); 
            transition: width 0.5s linear;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        /* Iframe pro automatické přesměrování */
        #app-frame { display: none; width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="maintenance-ui">
        <div class="container">
            <div class="icon">🛠️</div>
            <h1>Údržba systému</h1>
            <p>Právě probíhá plánovaná aktualizace.</p>
            <p>KotakEngine bude brzy zpět online.</p>
            
            <div class="loader-area" style="margin-top: 20px;">
                <div class="loader-bar">
                    <div id="progress-fill"></div>
                </div>
                <div id="status-text" style="font-size: 10px; color: #444; margin-top: 8px; font-family: monospace;"></div>
            </div>
        </div>
    </div>

    <iframe id="app-frame" src=""></iframe>

    <script>
        // ==========================================
        //  ⚙️ NASTAVENÍ ÚDRŽBY (Formát: 'RRRR-MM-DD HH:MM')
        // ==========================================
        const zacatekUdrzby = '2026-03-26 12:00'; 
        const konecUdrzby    = '2026-03-27 14:00'; 
        // ==========================================

        const progressFill = document.getElementById('progress-fill');
        const maintenanceUI = document.getElementById('maintenance-ui');
        const appFrame = document.getElementById('app-frame');
        const statusText = document.getElementById('status-text');

        // Převod na milisekundy (aby s tím JS mohl počítat)
        const startTime = new Date(zacatekUdrzby.replace(' ', 'T')).getTime();
        const endTime = new Date(konecUdrzby.replace(' ', 'T')).getTime();

        function updateProgress() {
            const now = new Date().getTime();
            
            // Výpočet celkového času a uplynulého času
            const totalDuration = endTime - startTime;
            const elapsed = now - startTime;
            
            let percent = (elapsed / totalDuration) * 100;
            
            // Ošetření stavů
            if (percent < 0) {
                percent = 0;
                statusText.innerText = "Údržba ještě nezačala";
            } else if (percent >= 100) {
                percent = 100;
                statusText.innerText = "Dokončeno. Přesměrovávám...";
                
                // Přepnutí na aplikaci
                maintenanceUI.style.display = "none";
                appFrame.style.display = "block";
                appFrame.src = "index.html"; 
                clearInterval(timer);
            } else {
                statusText.innerText = "Průběh: " + Math.floor(percent) + "%";
            }

            progressFill.style.width = percent + "%";
        }

        // Kontrola každou sekundu
        const timer = setInterval(updateProgress, 1000);
        updateProgress();
    </script>
</body>
</html>
