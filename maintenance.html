<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Údržba | KotakEngine</title>
    <style>
        :root { --primary: #4caf50; --bg: #000; --card-bg: #111; }
        body, html { margin: 0; padding: 0; height: 100%; background-color: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; }
        
        #maintenance-ui {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; text-align: center; flex-direction: column;
            width: 100%;
        }

        .container { width: 85%; max-width: 400px; padding: 40px 30px; border: 1px solid #222; border-radius: 40px; background: var(--card-bg); box-sizing: border-box; }
        .icon { font-size: 50px; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0 0 10px 0; font-size: 1.5rem; }
        p { color: #888; line-height: 1.6; margin-bottom: 5px; font-size: 14px; }
        
        .loader-bar { 
            width: 100%; height: 10px; background: #1a1a1a; 
            margin-top: 30px; border-radius: 20px; overflow: hidden; 
            border: 1px solid #333;
        }
        #progress-fill { 
            width: 0%; height: 100%; background: var(--primary); 
            transition: width 0.5s linear;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        #app-frame { display: none; width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="maintenance-ui">
        <div class="container">
            <div class="icon">🛠️</div>
            <h1>Údržba systému</h1>
            <p>Právě probíhá plánovaná aktualizace.</p>
            <p>KotakEngine bude brzy zpět online.</p>
            
            <div class="loader-bar">
                <div id="progress-fill"></div>
            </div>
        </div>
    </div>

    <iframe id="app-frame" src=""></iframe>

    <script>
        // ==========================================
        //  ⚙️ NASTAVENÍ ÚDRŽBY
        // ==========================================
        const den = 25;           // Den konání
        const mesic = 3;          // Měsíc konání
        
        const casZacatku = "16:00"; // Kdy bar začíná na 0%
        const casKonce = "18:00";   // Kdy bar dojede na 100%
        // ==========================================

        const progressFill = document.getElementById('progress-fill');
        const maintenanceUI = document.getElementById('maintenance-ui');
        const appFrame = document.getElementById('app-frame');

        const rok = new Date().getFullYear();
        
        // Sestavení strojového času
        const startString = `${rok}-${String(mesic).padStart(2, '0')}-${String(den).padStart(2, '0')}T${casZacatku}:00`;
        const endString = `${rok}-${String(mesic).padStart(2, '0')}-${String(den).padStart(2, '0')}T${casKonce}:00`;
        
        const startTime = new Date(startString).getTime();
        const endTime = new Date(endString).getTime();

        function updateProgress() {
            const now = new Date().getTime();
            const total = endTime - startTime;
            const elapsed = now - startTime;
            
            let percent = (elapsed / total) * 100;
            
            // Ošetření limitů
            if (percent < 0) percent = 0;
            if (percent > 100) percent = 100;

            progressFill.style.width = percent + "%";

            // PŘEPNUTÍ PO KONCI
            if (percent >= 100) {
                maintenanceUI.style.display = "none";
                appFrame.style.display = "block";
                appFrame.src = "index.html"; 
                clearInterval(checkInterval);
            }
        }

        const checkInterval = setInterval(updateProgress, 1000);
        updateProgress();
    </script>
</body>
</html>
