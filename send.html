<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine - Send</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #4caf50; --error: #ff4757; --bg: #000; --card-bg: rgba(22, 22, 22, 0.95); }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 400px; padding: 40px 0; display: flex; flex-direction: column; gap: 20px; }
        .upload-area { background: var(--card-bg); border: 1px solid #333; border-radius: 30px; padding: 30px; text-align: center; cursor: pointer; }
        #preview-zone { display: none; background: #1a1a1a; border-radius: 25px; padding: 20px; border: 1px solid #444; text-align: center; }
        #preview-img { max-width: 100%; max-height: 200px; border-radius: 15px; margin-bottom: 10px; display: none; }
        .btn-share { background: var(--primary); color: #000; border: none; padding: 18px; border-radius: 40px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-share:disabled { background: #222; color: #555; cursor: not-allowed; }
        #stop-button { position: fixed; top: 20px; left: -220px; background: var(--error); color: #fff; border: none; padding: 12px 25px; border-radius: 30px; font-weight: bold; transition: 0.4s; z-index: 1000; box-shadow: 0 0 20px rgba(255, 71, 87, 0.4); }
        #stop-button.visible { left: 20px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <button id="stop-button" onclick="stopSharing()">&#10094; UKONČIT SDÍLENÍ</button>

    <div class="container">
        <h2 style="color: var(--primary); text-align: center;">Kotak Send</h2>
        <div id="user-id-tag" style="font-size: 10px; color: #444; text-align: center;"></div>

        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 40px;">📂</div>
            <p id="label">Vyber soubor</p>
        </div>
        <input type="file" id="file-input">

        <div id="preview-zone">
            <img id="preview-img" src="">
            <div id="file-name" style="font-weight: bold;"></div>
            <div id="file-size" style="color: #888; font-size: 12px; margin-bottom: 10px;"></div>
        </div>

        <div id="status" style="text-align: center; color: var(--primary); min-height: 20px; font-size: 14px;"></div>
        <button id="btn-submit" class="btn-share" disabled>SDÍLET</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBlgu2gdLYiAtqMlN2ABprU6rrXS-w5JfI",
            authDomain: "kotakengine.firebaseapp.com",
            databaseURL: "https://kotakengine-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotakengine"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let senderId = localStorage.getItem('kotak_sender_id') || ('sid_' + Math.random().toString(36).substr(2, 9));
        localStorage.setItem('kotak_sender_id', senderId);
        document.getElementById('user-id-tag').innerText = "ID: " + senderId;

        const fileInput = document.getElementById('file-input');
        const btnSubmit = document.getElementById('btn-submit');
        const status = document.getElementById('status');
        let selectedFile = null;

        fileInput.onchange = (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                document.getElementById('preview-zone').style.display = "block";
                document.getElementById('file-name').innerText = selectedFile.name;
                document.getElementById('file-size').innerText = (selectedFile.size/1024).toFixed(1) + " KB";
                
                if (selectedFile.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => { 
                        const img = document.getElementById('preview-img');
                        img.src = ev.target.result; 
                        img.style.display="block"; 
                    };
                    reader.readAsDataURL(selectedFile);
                }
                btnSubmit.disabled = false;
            }
        };

        btnSubmit.onclick = async () => {
            btnSubmit.disabled = true;
            status.innerText = "Nahrávám...";

            const formData = new FormData();
            formData.append("reqtype", "fileupload");
            formData.append("fileToUpload", selectedFile);

            try {
                // Nahrání přes CORS proxy na Catbox
                const resp = await fetch("https://corsproxy.io/?https://catbox.moe/user/api.php", { 
                    method: "POST", 
                    body: formData 
                });
                const fileUrl = await resp.text();

                if (fileUrl.startsWith("https://")) {
                    await db.ref('shares/' + senderId).set({
                        fileName: selectedFile.name,
                        fileUrl: fileUrl,
                        fileSize: selectedFile.size,
                        expiresAt: Date.now() + 3600000,
                        isActive: true
                    });
                    status.innerText = "SOUBOR JE AKTIVNÍ";
                    document.getElementById('stop-button').classList.add('visible');
                } else {
                    throw new Error("Neplatná odpověď serveru");
                }
            } catch (err) {
                status.innerText = "Chyba při odesílání!";
                btnSubmit.disabled = false;
            }
        };

        async function stopSharing() {
            if(confirm("Ukončit sdílení?")) {
                await db.ref('shares/' + senderId).remove();
                location.reload();
            }
        }
    </script>
</body>
</html>
