<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine - Send</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #4caf50; --error: #ff4757; --bg: #000; --card-bg: #111; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Tlačítko zpět (vlevo) */
        .back-nav {
            position: fixed; top: 20px; left: 20px; z-index: 1001;
            background: var(--primary); width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            cursor: pointer; border: none; color: white;
        }

        /* Plovoucí tlačítko ZRUŠIT (vpravo) */
        #stop-button { 
            position: fixed; top: 20px; right: -250px; 
            background: var(--error); color: #fff; border: none; 
            padding: 12px 20px; border-radius: 30px; font-weight: bold; 
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 1000; box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
        }
        #stop-button.visible { right: 20px; }

        .container { width: 90%; max-width: 400px; padding: 60px 0 20px 0; display: flex; flex-direction: column; gap: 20px; }
        .upload-area { background: var(--card-bg); border: 1px dashed #333; border-radius: 30px; padding: 40px 20px; text-align: center; cursor: pointer; }
        
        #preview-zone { 
            display: none; background: #1a1a1a; border-radius: 25px; 
            padding: 20px; border: 1px solid #444; text-align: center; 
        }
        #preview-img { max-width: 100%; max-height: 150px; border-radius: 10px; margin-bottom: 10px; display: none; }

        .btn-share { 
            background: var(--primary); color: #000; border: none; 
            padding: 18px; border-radius: 40px; font-weight: bold; 
            width: 100%; cursor: pointer; font-size: 1.1rem; margin-top: 10px;
        }
        .btn-share:disabled { background: #222; color: #555; }
        
        #status { text-align: center; font-size: 14px; margin-top: 10px; min-height: 20px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <button class="back-nav" onclick="history.back()">&#10094;</button>

    <button id="stop-button" onclick="stopSharing()">ZRUŠIT SDÍLENÍ</button>

    <div class="container">
        <h2 style="color: var(--primary); text-align: center;">Kotak Send</h2>
        <div id="user-id-tag" style="font-size: 10px; color: #444; text-align: center; margin-bottom: 20px;"></div>

        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 40px;">📂</div>
            <p style="margin:0; font-weight:bold;">Vybrat soubor</p>
        </div>
        <input type="file" id="file-input">

        <div id="preview-zone">
            <img id="preview-img" src="">
            <div id="file-name" style="font-weight: bold; font-size: 14px; word-break: break-all;"></div>
            <div id="file-size" style="color: #888; font-size: 12px;"></div>
        </div>

        <div id="status"></div>
        <button id="btn-submit" class="btn-share" disabled>SDÍLET PŘES NFC</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBlgu2gdLYiAtqMlN2ABprU6rrXS-w5JfI",
            databaseURL: "https://kotakengine-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotakengine"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let senderId = localStorage.getItem('kotak_sender_id') || ('sid_' + Math.random().toString(36).substr(2, 9));
        localStorage.setItem('kotak_sender_id', senderId);
        document.getElementById('user-id-tag').innerText = "MOJE ID: " + senderId;

        const fileInput = document.getElementById('file-input');
        const btnSubmit = document.getElementById('btn-submit');
        const status = document.getElementById('status');
        let selectedFile = null;
        let fileBase64 = null;

        fileInput.onchange = (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    fileBase64 = ev.target.result;
                    document.getElementById('preview-zone').style.display = "block";
                    document.getElementById('file-name').innerText = selectedFile.name;
                    document.getElementById('file-size').innerText = (selectedFile.size/1024).toFixed(1) + " KB";
                    
                    if (selectedFile.type.startsWith('image/')) {
                        document.getElementById('preview-img').src = fileBase64;
                        document.getElementById('preview-img').style.display = "block";
                    } else {
                        document.getElementById('preview-img').style.display = "none";
                    }
                    btnSubmit.disabled = false;
                    status.innerText = "Soubor připraven k nahrání.";
                    status.style.color = "#fff";
                };
                reader.readAsDataURL(selectedFile);
            }
        };

        btnSubmit.onclick = async () => {
            btnSubmit.disabled = true;
            status.innerText = "Zapisuji do databáze...";

            try {
                await db.ref('shares/' + senderId).set({
                    name: selectedFile.name,
                    data: fileBase64,
                    size: selectedFile.size,
                    type: selectedFile.type,
                    expires: Date.now() + 3600000,
                    active: true
                });

                status.innerText = "SDÍLENÍ AKTIVNÍ";
                status.style.color = "#4caf50";
                document.getElementById('stop-button').classList.add('visible');
            } catch (err) {
                console.error(err);
                status.innerText = "Chyba při sdílení.";
                status.style.color = "#ff4757";
                btnSubmit.disabled = false;
            }
        };

        function stopSharing() {
            if(confirm("Chceš ukončit sdílení souboru?")) {
                db.ref('shares/' + senderId).remove();
                location.reload();
            }
        }
    </script>
</body>
</html>
