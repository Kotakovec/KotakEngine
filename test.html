<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine - Sdílení</title>
    <style>
        :root {
            --primary: #4caf50;
            --error: #ff4757;
            --bg: #000;
            --card-bg: rgba(22, 22, 22, 0.9);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
        }

        h2 { color: var(--primary); margin-bottom: 30px; }

        /* Zóna pro výběr souboru */
        .upload-box {
            background: var(--card-bg);
            border: 2px dashed #333;
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .upload-box.active { border-color: var(--primary); }

        .file-info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }

        /* Tlačítko Sdílet (Kapsle) */
        .btn-capsule {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
            transition: transform 0.1s;
        }

        .btn-capsule:active { transform: scale(0.96); }
        .btn-capsule:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* Plovoucí tlačítko UKONČIT (shodné s tlačítkem zpět) */
        #stop-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--error);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            z-index: 999;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            display: none; /* Ukáže se až při sdílení */
        }

        #stop-button.visible { display: block; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sdílet soubor</h2>

        <div class="upload-box" onclick="document.getElementById('file-input').click()" id="drop-zone">
            <span style="font-size: 40px;">📂</span>
            <p id="status-text">Klepni pro výběr souboru</p>
            <div id="file-details" class="file-info"></div>
        </div>

        <input type="file" id="file-input">

        <button id="btn-share" class="btn-capsule" disabled>SDÍLET PŘES NFC</button>
    </div>

    <button id="stop-button" onclick="stopSharing()">UKONČIT SDÍLENÍ</button>

    <script>
        const fileInput = document.getElementById('file-input');
        const btnShare = document.getElementById('btn-share');
        const statusText = document.getElementById('status-text');
        const fileDetails = document.getElementById('file-details');
        const stopButton = document.getElementById('stop-button');

        let selectedFile = null;

        // Výběr souboru
        fileInput.onchange = (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                statusText.innerText = "Soubor připraven";
                fileDetails.innerText = `${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
                btnShare.disabled = false;
            }
        };

        // Funkce Sdílet (Zápis na NFC)
        btnShare.onclick = async () => {
            if (!('NDEFReader' in window)) {
                alert("NFC není podporováno. Přenos bude simulován.");
                startSharingMode();
                return;
            }

            try {
                const ndef = new NDEFReader();
                // Vygenerujeme dočasné ID pro tento soubor
                const shareId = "kotak_" + Math.random().toString(36).substr(2, 9);
                
                // Zde bys soubor nahrál na Firebase/KotakEngine cloud
                // URL, kterou si druhý člověk přečte z tagu
                const url = `${window.location.origin}/receive.html?id=${shareId}`;

                await ndef.write({
                    records: [{ recordType: "url", data: url }]
                });

                alert("Zapsáno! Teď může kdokoliv přiložit telefon k tvé nálepce.");
                startSharingMode();
            } catch (error) {
                alert("Chyba při zápisu: " + error);
            }
        };

        function startSharingMode() {
            btnShare.innerText = "AKTIVNÍ SDÍLENÍ...";
            btnShare.disabled = true;
            stopButton.classList.add('visible');
            // Zde by běžela tvoje WebRTC nebo Firebase logika pro odesílání
        }

        function stopSharing() {
            // Resetování stránky nebo návrat do menu
            if (confirm("Opravdu chceš ukončit sdílení souboru?")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
