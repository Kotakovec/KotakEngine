<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine - Send</title>
    <style>
        :root {
            --primary: #4caf50;
            --error: #ff4757;
            --bg: #000;
            --card-bg: rgba(22, 22, 22, 0.9);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 { color: var(--primary); text-align: center; margin-bottom: 10px; }

        /* 1. VÝBĚR SOUBORU */
        .upload-area {
            background: var(--card-bg);
            border: 2px dashed #333;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
        }

        /* 2. PREVIEW (NÁHLED) */
        #preview-zone {
            display: none; /* Ukáže se až po výběru */
            background: #1a1a1a;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #333;
            text-align: center;
        }

        #preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: none;
        }

        .file-meta { font-size: 0.9rem; color: #aaa; }

        /* 3. TLAČÍTKO ODESLAT (KAPSLE) */
        .btn-send {
            background: var(--primary);
            color: black;
            border: none;
            padding: 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.2);
            transition: transform 0.1s;
        }

        .btn-send:active { transform: scale(0.96); }
        .btn-send:disabled { background: #333; color: #666; }

        /* 4. PLOVOUCÍ TLAČÍTKO UKONČIT (Stejné jako v main.html) */
        #stop-button {
            position: fixed;
            top: 15px;
            left: -150px; /* Schované vlevo */
            background-color: var(--error);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            z-index: 999;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #stop-button.visible { left: 15px; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <button id="stop-button" onclick="resetSharing()">&#10094; UKONČIT SDÍLENÍ</button>

    <div class="container">
        <h2>Kotak Share</h2>

        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <span style="font-size: 30px;">📄</span>
            <p>Vyber soubor k nahrání</p>
        </div>
        <input type="file" id="file-input">

        <div id="preview-zone">
            <img id="preview-img" src="" alt="Náhled">
            <div id="file-name" class="file-meta" style="color: #fff; font-weight: bold;"></div>
            <div id="file-size" class="file-meta"></div>
        </div>

        <button id="btn-submit" class="btn-send" disabled>SDÍLET PŘES NFC</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewZone = document.getElementById('preview-zone');
        const previewImg = document.getElementById('preview-img');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const btnSubmit = document.getElementById('btn-submit');
        const stopButton = document.getElementById('stop-button');

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                previewZone.style.display = "block";
                fileName.innerText = file.name;
                fileSize.innerText = (file.size / 1024).toFixed(1) + " KB";
                
                // Pokud je to obrázek, ukážeme náhled
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        previewImg.src = event.target.result;
                        previewImg.style.display = "block";
                    };
                    reader.readAsDataURL(file);
                } else {
                    previewImg.style.display = "none";
                }
                
                btnSubmit.disabled = false;
            }
        };

        btnSubmit.onclick = () => {
            // Tady by se soubor nahrál na tvůj server/Firebase
            alert("Sdílení aktivováno! Kdokoliv teď pípne tvůj telefon, uvidí tento soubor.");
            
            // Aktivace režimu sdílení
            btnSubmit.innerText = "SOUBOR SE SDÍLÍ...";
            btnSubmit.disabled = true;
            stopButton.classList.add('visible');
        };

        function resetSharing() {
            if (confirm("Chceš zastavit sdílení a vymazat soubor?")) {
                location.reload(); // Vrátí vše do původního stavu
            }
        }
    </script>
</body>
</html>
