<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root { --primary: #4caf50; --bg: #000; --card-bg: #111; }
        body, html { margin: 0; padding: 0; height: 100%; background-color: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        #install-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 30px; box-sizing: border-box; }
        .logo-img { width: 120px; height: 120px; border-radius: 25px; margin-bottom: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); background-image: url('logo.png'); background-size: cover; background-position: center; }
        #btn-install { display: none; background: var(--primary); color: #000; border: none; padding: 18px 40px; border-radius: 30px; font-weight: bold; font-size: 16px; margin: 20px 0; cursor: pointer; }
        #main-app-container { display: none; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
        .instruction-box { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #222; max-width: 320px; font-size: 13px; color: #888; }
    </style>
</head>
<body>

    <div id="install-screen">
        <div class="logo-img"></div>
        <h1 style="margin-bottom: 5px;">KotakEngine</h1>
        <p style="color: #666; margin-top: 0;">Aplikace vyžaduje spuštění z plochy.</p>
        <button id="btn-install">INSTALOVAT TEĎ</button>
        <div class="instruction-box">
            <b style="color: #fff;">iPhone:</b> Klepni na ikonu sdílení a zvol "Přidat na plochu".<br><br>
            <b style="color: #fff;">Android:</b> Klepni na tři tečky a zvol "Instalovat aplikaci".
        </div>
    </div>

    <div id="main-app-container">
        <iframe id="main-frame" src="about:blank"></iframe>
    </div>

    <script>
        // === ⚙️ NASTAVENÍ ÚDRŽBY ===
        // Zkus teď nastavit čas, který už URČITĚ nastal (např. včerejšek), abys viděl, jestli to funguje
        const startUdrzby = new Date('2026-03-25T17:00:00').getTime(); 
        const konecUdrzby  = new Date('2026-03-25T17:30:00').getTime(); 
        // ===========================

        const installScreen = document.getElementById('install-screen');
        const mainAppContainer = document.getElementById('main-app-container');
        const mainFrame = document.getElementById('main-frame');
        const btnInstall = document.getElementById('btn-install');

        function initApp() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const now = new Date().getTime();

            if (isStandalone) {
                installScreen.style.display = "none";
                mainAppContainer.style.display = "block";

                // LOGIKA ROZHODOVÁNÍ
                if (now >= startUdrzby && now < konecUdrzby) {
                    console.log("Stav: ÚDRŽBA");
                    mainFrame.src = "maintenance.html?v=" + now;
                } else {
                    console.log("Stav: PROVOZ");
                    mainFrame.src = "main.html?v=" + now;
                }
            } else {
                installScreen.style.display = "flex";
                mainAppContainer.style.display = "none";
            }
        }

        // Instalace (Android)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstall.style.display = 'block';
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                btnInstall.style.display = 'none';
            }
        });

        window.addEventListener('load', initApp);
    </script>
</body>
</html>
