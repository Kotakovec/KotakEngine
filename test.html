<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Údržba | KotakEngine</title>
    <style>
        :root { --primary: #4caf50; --bg: #000; --card-bg: #111; }
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background-color: var(--bg); color: #fff; 
            font-family: sans-serif; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; 
        }

        .container { 
            width: 85%; max-width: 400px; padding: 40px 30px; 
            border: 1px solid #222; border-radius: 40px; 
            background: var(--card-bg); text-align: center;
        }

        .icon { font-size: 50px; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0 0 10px 0; font-size: 1.5rem; }
        p { color: #888; line-height: 1.6; margin-bottom: 5px; font-size: 14px; }

        .loader-bar { 
            width: 100%; height: 10px; background: #1a1a1a; 
            margin-top: 30px; border-radius: 20px; overflow: hidden; 
            border: 1px solid #333;
        }

        #progress-fill { 
            width: 0%; height: 100%; background: var(--primary); 
            transition: width 0.5s linear;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <h1>Údržba systému</h1>
        <p>Právě probíhá aktualizace softwaru.</p>
        <p>KotakEngine bude brzy online.</p>

        <div class="loader-bar">
            <div id="progress-fill"></div>
        </div>
    </div>

    <script>
        // === NASTAVENÍ (Musí být stejné jako v index.html) ===
        const start = new Date('2026-03-25T17:00:00').getTime(); 
        const konec = new Date('2026-03-25T17:41:00').getTime(); 

        const fill = document.getElementById('progress-fill');

        function update() {
            const now = new Date().getTime();
            
            // Kolik času už uteklo od startu (v ms)
            const elapsed = now - start;
            // Kolik času má údržba celkem (v ms)
            const total = konec - start;
            
            // Výpočet procent
            let proc = (elapsed / total) * 100;

            // Omezení, aby to nebylo mimo 0-100
            if (proc < 0) proc = 0;
            if (proc > 100) proc = 100;

            // Nastavení šířky baru
            fill.style.width = proc + "%";

            // Pokud je konec, reloadni celý web (index ho pak pošle do main.html)
            if (proc === 100) {
                window.parent.location.reload();
                clearInterval(interval);
            }
        }

        // Update každou sekundu
        const interval = setInterval(update, 1000);
        update();
    </script>
</body>
</html>
