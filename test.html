<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        
        /* Styl pro údržbovou kartu (vložená přímo, aby to bylo bleskové) */
        #maintenance-overlay {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: #000; color: white; text-align: center;
        }
        .container { 
            width: 85%; max-width: 400px; padding: 40px 30px; 
            border: 1px solid #222; border-radius: 40px; background: #111; 
        }
        .icon { font-size: 50px; margin-bottom: 20px; }
        h1 { color: #4caf50; margin: 0 0 10px 0; font-size: 1.5rem; }
        p { color: #888; font-size: 14px; }
        .loader-bar { width: 100%; height: 10px; background: #1a1a1a; margin-top: 30px; border-radius: 20px; overflow: hidden; border: 1px solid #333; }
        #progress-fill { width: 0%; height: 100%; background: #4caf50; transition: width 0.5s linear; box-shadow: 0 0 20px rgba(76, 175, 80, 0.5); }
    </style>
</head>
<body>

    <div id="maintenance-overlay">
        <div class="container">
            <div class="icon">🛠️</div>
            <h1>Údržba systému</h1>
            <p>Právě probíhá aktualizace softwaru.</p>
            <div class="loader-bar"><div id="progress-fill"></div></div>
        </div>
    </div>

    <iframe id="main-frame" src=""></iframe>

    <script>
        // ==========================================
        //  ⚙️ NASTAVENÍ (Tady měň časy)
        // ==========================================
        const startUdrzby = new Date('2026-03-25T17:00:00').getTime(); 
        const konecUdrzby  = new Date('2026-03-25T20:00:00').getTime(); 
        // ==========================================

        const frame = document.getElementById('main-frame');
        const overlay = document.getElementById('maintenance-overlay');
        const fill = document.getElementById('progress-fill');

        function checkSystem() {
            const now = new Date().getTime();

            // Pokud jsme v časovém okně údržby
            if (now >= startUdrzby && now < konecUdrzby) {
                overlay.style.display = "flex";
                frame.style.display = "none";
                frame.src = ""; // Vyčistíme iframe

                // Výpočet progresu pro bar
                const total = konecUdrzby - startUdrzby;
                const elapsed = now - startUdrzby;
                let percent = (elapsed / total) * 100;
                fill.style.width = percent + "%";

            } else {
                // Pokud údržba není nebo už skončila
                overlay.style.display = "none";
                frame.style.display = "block";
                
                // Načteme main.html jen pokud už tam není
                if (!frame.src.includes("main.html")) {
                    frame.src = "main.html?v=" + now;
                }
            }
        }

        // Kontrola každou sekundu, aby se to přeplo samo hned vteřinu po skončení
        setInterval(checkSystem, 1000);
        checkSystem();
    </script>
</body>
</html>
