<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine - Send</title>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

    <style>
        :root {
            --primary: #4caf50;
            --error: #ff4757;
            --bg: #000;
            --card-bg: rgba(22, 22, 22, 0.95);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin: 0;
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
        }

        #user-id-tag {
            font-size: 10px;
            color: #444;
            text-align: center;
            margin-top: -10px;
        }

        /* 1. VÝBĚR SOUBORU */
        .upload-area {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
        }

        /* 2. PREVIEW */
        #preview-zone {
            display: none;
            background: rgba(30, 30, 30, 0.8);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid #444;
            text-align: center;
        }

        #preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: none;
        }

        .file-details { font-size: 0.9rem; color: #ccc; }

        /* 3. TLAČÍTKO SDÍLET */
        .btn-share {
            background: var(--primary);
            color: black;
            border: none;
            padding: 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-share:disabled { background: #222; color: #555; cursor: not-allowed; }

        /* 4. PLOVOUCÍ TLAČÍTKO UKONČIT */
        #stop-button {
            position: fixed;
            top: 20px;
            left: -200px;
            background-color: var(--error);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            z-index: 999;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #stop-button.visible { left: 20px; }

        input[type="file"] { display: none; }

        #status-msg {
            text-align: center;
            font-size: 14px;
            color: var(--primary);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <button id="stop-button" onclick="stopSharing()">&#10094; UKONČIT SDÍLENÍ</button>

    <div class="container">
        <h2>Kotak Send</h2>
        <div id="user-id-tag"></div>

        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 40px; margin-bottom: 10px;">📤</div>
            <p id="label-text">Vyber soubor k odeslání</p>
        </div>
        <input type="file" id="file-input">

        <div id="preview-zone">
            <img id="preview-img" src="">
            <div class="file-details">
                <div id="file-name" style="font-weight: bold; color: #fff; margin-bottom: 5px;"></div>
                <div id="file-size"></div>
            </div>
        </div>

        <div id="status-msg"></div>
        <button id="btn-submit" class="btn-share" disabled>SDÍLET</button>
    </div>

    <script>
        // --- KONFIGURACE FIREBASE (Tvoje údaje) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBlgu2gdLYiAtqMlN2ABprU6rrXS-w5JfI",
            authDomain: "kotakengine.firebaseapp.com",
            databaseURL: "https://kotakengine-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "kotakengine",
            storageBucket: "kotakengine.firebasestorage.app",
            messagingSenderId: "165516964834",
            appId: "1:165516964834:web:2d3089665eefa76d9bffbb",
            measurementId: "G-ZSM0GF21LL"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        // --- GENERAT ID ---
        let senderId = localStorage.getItem('kotak_sender_id');
        if (!senderId) {
            senderId = 'sid_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('kotak_sender_id', senderId);
        }
        document.getElementById('user-id-tag').innerText = "SENDER ID: " + senderId;

        // --- LOGIKA ---
        const fileInput = document.getElementById('file-input');
        const btnSubmit = document.getElementById('btn-submit');
        const statusMsg = document.getElementById('status-msg');
        const stopButton = document.getElementById('stop-button');
        let selectedFile = null;

        fileInput.onchange = (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                document.getElementById('preview-zone').style.display = "block";
                document.getElementById('file-name').innerText = selectedFile.name;
                document.getElementById('file-size').innerText = (selectedFile.size / 1024).toFixed(1) + " KB";

                if (selectedFile.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = document.getElementById('preview-img');
                        img.src = ev.target.result;
                        img.style.display = "block";
                    };
                    reader.readAsDataURL(selectedFile);
                }
                btnSubmit.disabled = false;
            }
        };

        btnSubmit.onclick = async () => {
            if (!selectedFile) return;
            
            btnSubmit.disabled = true;
            statusMsg.innerText = "Nahrávám soubor...";

            const fileRef = storage.ref().child(`shares/${senderId}/${selectedFile.name}`);

            try {
                // 1. Upload do Storage
                const snapshot = await fileRef.put(selectedFile);
                const downloadUrl = await snapshot.ref.getDownloadURL();

                // 2. Zápis do RTDB
                await db.ref('shares/' + senderId).set({
                    fileName: selectedFile.name,
                    fileUrl: downloadUrl,
                    fileSize: selectedFile.size,
                    expiresAt: Date.now() + 3600000, // +1 hodina
                    isActive: true
                });

                statusMsg.innerText = "SDÍLENÍ AKTIVNÍ";
                btnSubmit.innerText = "SDÍLÍ SE...";
                stopButton.classList.add('visible');
                
            } catch (error) {
                console.error(error);
                statusMsg.innerText = "Chyba při nahrávání!";
                btnSubmit.disabled = false;
            }
        };

        async function stopSharing() {
            if (!confirm("Ukončit sdílení? Soubor bude zneplatněn.")) return;
            
            try {
                // Deaktivace v databázi
                await db.ref('shares/' + senderId).remove();
                location.reload();
            } catch (e) {
                location.reload();
            }
        }
    </script>
</body>
</html>
