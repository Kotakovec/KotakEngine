<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KotakEngine - Odeslat</title>
    <style>
        :root {
            --primary: #4caf50;
            --error: #ff4757;
            --bg: #000;
            --card-bg: rgba(22, 22, 22, 0.95);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hlavní kontejner */
        .container {
            width: 90%;
            max-width: 400px;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.4);
        }

        /* 1. VÝBĚR SOUBORU */
        .upload-area {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .upload-area:active { border-color: var(--primary); }

        /* 2. PREVIEW (NÁHLED) */
        #preview-zone {
            display: none; /* Skryté do vybrání souboru */
            background: rgba(30, 30, 30, 0.8);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid #444;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        #preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: none;
            border: 1px solid #555;
        }

        .file-details {
            font-size: 0.9rem;
            color: #ccc;
        }

        /* 3. TLAČÍTKO SDÍLET (KAPSLE) */
        .btn-share {
            background: var(--primary);
            color: black;
            border: none;
            padding: 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.2);
            transition: transform 0.1s, opacity 0.3s;
        }

        .btn-share:active { transform: scale(0.96); }
        .btn-share:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        /* 4. PLOVOUCÍ TLAČÍTKO UKONČIT (Styl z main.html) */
        #stop-button {
            position: fixed;
            top: 20px;
            left: -180px; /* Schované mimo obrazovku */
            background-color: var(--error);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            z-index: 999;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #stop-button.visible { left: 20px; }

        input[type="file"] { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <button id="stop-button" onclick="stopSharing()">&#10094; UKONČIT SDÍLENÍ</button>

    <div class="container">
        <h2>Kotak Send</h2>

        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <div style="font-size: 40px; margin-bottom: 10px;">📤</div>
            <p id="upload-label">Klepni pro nahrání souboru</p>
        </div>
        <input type="file" id="file-input">

        <div id="preview-zone">
            <img id="preview-img" src="" alt="Náhled">
            <div class="file-details">
                <div id="file-name" style="font-weight: bold; color: #fff; margin-bottom: 5px;"></div>
                <div id="file-size"></div>
            </div>
        </div>

        <button id="btn-submit" class="btn-share" disabled>SDÍLET</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewZone = document.getElementById('preview-zone');
        const previewImg = document.getElementById('preview-img');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const btnSubmit = document.getElementById('btn-submit');
        const stopButton = document.getElementById('stop-button');
        const uploadLabel = document.getElementById('upload-label');

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                // Aktivace Preview
                previewZone.style.display = "block";
                fileName.innerText = file.name;
                fileSize.innerText = (file.size / 1024).toFixed(1) + " KB";
                
                // Náhled obrázku
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        previewImg.src = event.target.result;
                        previewImg.style.display = "block";
                    };
                    reader.readAsDataURL(file);
                } else {
                    previewImg.style.display = "none";
                }
                
                btnSubmit.disabled = false;
                uploadLabel.innerText = "Změnit soubor";
            }
        };

        // KROK 3: ODESLAT (Aktivace sdílení)
        btnSubmit.onclick = () => {
            // Tady by proběhl upload na server
            console.log("Sdílení zahájeno...");
            
            btnSubmit.innerText = "SOUBOR JE AKTIVNÍ";
            btnSubmit.style.opacity = "0.7";
            btnSubmit.disabled = true;

            // Vyjede tlačítko ukončit
            stopButton.classList.add('visible');
            
            alert("Soubor je připraven! Kdokoliv teď pípne tvůj tag, uvidí tento soubor na accept.html.");
        };

        // KROK 4: UKONČIT SDÍLENÍ
        function stopSharing() {
            if (confirm("Opravdu chceš ukončit sdílení a odstranit soubor?")) {
                // Reset stránky
                location.reload();
            }
        }
    </script>
</body>
</html>
